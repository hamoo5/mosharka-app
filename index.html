<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشاركة - الراكب</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1A237E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; text-align: center; background-color: #f0f2f5; padding: 10px; margin: 0; }
        .header { background-color: #1A237E; color: white; padding: 15px; font-size: 22px; font-weight: bold; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #map { height: 350px; width: 100%; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1; }
        #ride-info { display: none; background-color: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        #ride-info h3 { margin: 5px 0; color: #28a745; font-size: 22px; }
        .btn { background-color: #28a745; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; font-family: 'Cairo', sans-serif; }
        
        #driver-details { display: none; background-color: #e3f2fd; padding: 15px; border-radius: 12px; border: 2px solid #2196f3; margin-bottom: 15px; }
        #driver-details h3 { color: #1A237E; margin-top: 0; }
        .call-btn { display: inline-block; background-color: #2196f3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">تطبيق مشاركة</div>
    
    <!-- زرار تثبيت التطبيق -->
    <button id="installBtn" class="btn" style="display: none; background-color: #1A237E; margin-bottom: 15px;">📥 تثبيت التطبيق على هاتفك</button>

    <p style="font-size: 14px; color: #666;">اضغط على الخريطة لتحديد وجهتك</p>

    <div id="map"></div>

    <div id="ride-info">
        <p>المسافة: <span id="distance-text">0</span> كم</p>
        <h3>السعر: <span id="price-text">0</span> جنيه</h3>
    </div>

    <div id="driver-details">
        <h3>الكابتن في الطريق إليك 🚗</h3>
        <p>اسم الكابتن: <span id="d-name"></span></p>
        <a href="#" id="d-call" class="call-btn">📞 اتصل بالكابتن</a>
    </div>

    <button id="request-btn" class="btn" style="display: none;">اطلب التوصيل الآن</button>

    <script>
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        var startPoint = [30.0444, 31.2357];
        var map = L.map('map').setView(startPoint, 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker(startPoint).addTo(map).bindPopup('موقعك الحالي').openPopup();

        var destMarker = null, routeLine = null;
        var currentDestLat = 0, currentDestLng = 0, currentDistance = 0, currentPrice = 0, currentRideId = null;

        map.on('click', function(e) {
            currentDestLat = e.latlng.lat;
            currentDestLng = e.latlng.lng;

            if (destMarker) { map.removeLayer(destMarker); }
            if (routeLine) { map.removeLayer(routeLine); }

            destMarker = L.marker([currentDestLat, currentDestLng]).addTo(map).bindPopup('وجهتك').openPopup();
            routeLine = L.polyline([startPoint, [currentDestLat, currentDestLng]], {color: '#1A237E', weight: 5}).addTo(map);

            var distanceInMeters = map.distance(startPoint, [currentDestLat, currentDestLng]);
            currentDistance = (distanceInMeters / 1000).toFixed(2);
            currentPrice = Math.round(10 + (currentDistance * 5));

            document.getElementById('ride-info').style.display = 'block';
            document.getElementById('distance-text').innerText = currentDistance;
            document.getElementById('price-text').innerText = currentPrice;
            
            document.getElementById('request-btn').style.display = 'block';
            document.getElementById('request-btn').innerText = 'اطلب التوصيل الآن';
            document.getElementById('request-btn').style.backgroundColor = '#28a745';
            document.getElementById('request-btn').disabled = false;
            document.getElementById('driver-details').style.display = 'none'; 
        });

        document.getElementById('request-btn').addEventListener('click', async function() {
            this.innerText = 'جاري إرسال الطلب...';
            this.disabled = true;

            try {
                const { data, error } = await supabaseClient
                    .from('rides')
                    .insert([{ distance: currentDistance, price: currentPrice, dest_lat: currentDestLat, dest_lng: currentDestLng, status: 'pending' }])
                    .select();

                if (error) throw error;
                currentRideId = data[0].id; 
                
                this.innerText = 'في انتظار قبول الكابتن...';
                this.style.backgroundColor = '#ffc107';
                this.style.color = '#333';
            } catch (error) {
                alert('حدث خطأ: ' + error.message);
                this.innerText = 'اطلب التوصيل الآن';
                this.disabled = false;
            }
        });

        supabaseClient
            .channel('rider-channel')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rides' }, (payload) => {
                if (currentRideId && payload.new.id === currentRideId && payload.new.status === 'accepted') {
                    const btn = document.getElementById('request-btn');
                    btn.innerText = 'تم قبول الطلب';
                    btn.style.backgroundColor = '#6c757d';
                    
                    document.getElementById('driver-details').style.display = 'block';
                    document.getElementById('d-name').innerText = payload.new.driver_name;
                    
                    const callBtn = document.getElementById('d-call');
                    callBtn.href = 'tel:' + payload.new.driver_phone;
                }
            })
            .subscribe();

        // تشغيل الـ PWA (Service Worker)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }

        // كود زرار التثبيت
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // إظهار الزرار لما المتصفح يسمح
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // إظهار رسالة التثبيت
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none'; // إخفاء الزرار لو وافق
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
