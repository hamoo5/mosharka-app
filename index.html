<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توصيل مشاركة - الراكب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1f2d4a;
            --primary: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ff4757;
            --success: #22c55e;
        }

        .light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --primary: #0284c7;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s; }

        .top-nav { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }
        
        .mode-badge { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 11px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .mode-dot { width: 7px; height: 7px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); }

        #map { flex-grow: 1; width: 100%; height: 100vh; z-index: 1; background-color: #05070a; }
        .dark-tiles { filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4); }
        .light-tiles { filter: none; }

        /* دبوس التحديد */
        .center-pin { position: absolute; top: 27%; left: 50%; transform: translate(-50%, -100%); z-index: 2000; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .pin-icon { width: 42px; height: 42px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)); animation: float-pin 2s ease-in-out infinite; }
        @keyframes float-pin { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* تصميم سيارة الكابتن اللايف */
        .driver-marker-container { display: flex; flex-direction: column; align-items: center; }
        .driver-avatar-box { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--success); background: #000; box-shadow: 0 0 15px rgba(34, 197, 94, 0.6); display: flex; justify-content: center; align-items: center; }
        .driver-avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .driver-rating-badge { position: absolute; bottom: -8px; background: #111827; border: 1px solid var(--card-border); color: #fadb14; font-size: 9px; font-weight: bold; padding: 2px 4px; border-radius: 8px; white-space: nowrap; }

        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 18px; z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); border-top: 1px solid var(--card-border); max-height: 55vh; overflow-y: auto; transition: background 0.3s; }
        .sheet-handle { width: 40px; height: 4px; background: var(--card-border); border-radius: 2px; margin: 0 auto 12px auto; }
        
        .title { font-size: 17px; font-weight: 800; margin-bottom: 12px; text-align: center; color: var(--text-main); }
        .input-group { display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 10px; padding: 3px 4px 3px 10px; }
        .input-group input { flex-grow: 1; background: transparent !important; border: none; padding: 10px; color: var(--text-main) !important; font-size: 14px; outline: none; font-weight: 600; }
        .search-btn { background: var(--card-border); color: var(--text-main); border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .my-location-btn { width: 100%; background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px dashed var(--success); padding: 8px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .btn-main { width: 100%; background: var(--primary-gradient); color: #ffffff; padding: 14px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .route-summary-box { background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .route-step { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--text-main); }
        .dot-icon { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .dot-green { background: var(--success); } .dot-red { background: var(--danger); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-right">
            <a href="#" onclick="location.reload()" class="nav-btn" title="إعادة ضبط"><svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></a>
            <div class="mode-badge"><div class="mode-dot"></div> <span id="mode-text">الليلي</span></div>
        </div>
        <div class="nav-left">
            <button id="themeToggle" class="nav-btn" onclick="toggleTheme()" title="تبديل الوضع">🌙</button>
            <div class="nav-btn" onclick="alert('أحمد - الراكب')" title="الملف الشخصي">👤</div>
        </div>
    </div>

    <div id="map"></div>

    <div id="center-pin" class="center-pin">
        <svg class="pin-icon" viewBox="0 0 24 24" fill="#0284c7" id="pin-svg">
            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"/>
        </svg>
    </div>

    <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        
        <!-- 1. الانطلاق -->
        <div id="ui-pickup">
            <h2 class="title"><span style="color: #22c55e;">🟢</span> من أين تبدأ رحلتك؟</h2>
            <div class="input-group">
                <input type="text" id="search-pickup" placeholder="ابحث عن مكان الانطلاق..." autocomplete="off" onkeypress="handleSearch(event, 'pickup')">
                <button class="search-btn" onclick="handleSearch(null, 'pickup')">بحث</button>
            </div>
            
            <button class="my-location-btn" onclick="goToMyLocation()">📍 تحديد موقعي الحالي</button>

            <div class="route-summary-box">
                <div class="route-step"><div class="dot-icon dot-green"></div><span id="pickup-address" style="color: var(--text-sub);">جاري تحديد موقعك...</span></div>
            </div>
            <button class="btn-main" onclick="confirmPickup()">تأكيد نقطة الانطلاق ⚡</button>
        </div>

        <!-- 2. الوصول -->
        <div id="ui-dropoff" style="display: none;">
            <button class="btn-back" style="background: transparent; border:none; color: var(--text-sub); margin-bottom: 8px; cursor: pointer;" onclick="goBackToPickup()">← رجوع</button>
            <h2 class="title"><span style="color: var(--danger);">📍</span> إلى أين وجهتك القادمة؟</h2>
            <div class="route-summary-box" style="margin-bottom: 8px;">
                <div class="route-step"><div class="dot-icon dot-green"></div><span>من: <b id="confirmed-pickup-text" style="color: var(--text-main);">...</b></span></div>
            </div>
            <div class="input-group">
                <input type="text" id="search-dropoff" placeholder="اكتب وجهتك..." autocomplete="off" onkeypress="handleSearch(event, 'dropoff')">
                <button class="search-btn" onclick="handleSearch(null, 'dropoff')">بحث</button>
            </div>
            <div class="route-summary-box" style="margin-bottom: 8px;">
                <div class="route-step"><div class="dot-icon dot-red"></div><span id="dropoff-address" style="color: var(--text-sub);">حرك الخريطة لتحديد الوجهة...</span></div>
            </div>
            <button class="btn-main" onclick="confirmDropoff()">اعرض مسار الرحلة 🗺️</button>
        </div>
    </div>

    <script>
        // === إعدادات Supabase ===
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // === إعداد الخريطة ===
        var map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 15); 
        let tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        document.getElementById('map').classList.add('dark-tiles');

        let isDark = true;
        function toggleTheme() {
            isDark = !isDark;
            const btn = document.getElementById('themeToggle');
            const badgeText = document.getElementById('mode-text');
            const mapDiv = document.getElementById('map');
            
            if (isDark) {
                document.body.classList.remove('light-mode');
                mapDiv.classList.add('dark-tiles');
                mapDiv.classList.remove('light-tiles');
                btn.textContent = '🌙';
                badgeText.textContent = 'الليلي';
            } else {
                document.body.classList.add('light-mode');
                mapDiv.classList.remove('dark-tiles');
                mapDiv.classList.add('light-tiles');
                btn.textContent = '☀️';
                badgeText.textContent = 'النهاري';
            }
        }

        var pickupPoint = null, dropoffPoint = null;
        var currentStep = 'pickup'; 
        var startMarker = null, destMarker = null, userMarker = null, moveEndTimeout;
        let liveDriversMap = {}; 

        // === تصميم سيارة الكابتن (زي اللي في الصورة) ===
        const driverIcon = (name, rating) => L.divIcon({
            className: 'custom-driver-marker',
            html: `
                <div class="driver-marker-container">
                    <div class="driver-avatar-box">
                        <img src="https://i.pravatar.cc/100?img=11" alt="driver">
                        <div class="driver-rating-badge">${rating || '5.0'}★</div>
                    </div>
                </div>
            `,
            iconSize: [40, 40], iconAnchor: [20, 20]
        });

        // === استقبال الكباتن اللايف من جدول users ===
        function updateDriverOnMap(driver) {
            if (liveDriversMap[driver.id]) {
                liveDriversMap[driver.id].setLatLng([driver.lat, driver.lng]);
            } else {
                const marker = L.marker([driver.lat, driver.lng], { 
                    icon: driverIcon(driver.name, '4.9') 
                }).addTo(map);
                liveDriversMap[driver.id] = marker;
            }
        }

        function removeDriverFromMap(driverId) {
            if (liveDriversMap[driverId]) {
                map.removeLayer(liveDriversMap[driverId]);
                delete liveDriversMap[driverId];
            }
        }

        // جلب الكباتن أول ما التطبيق يفتح
        async function fetchInitialDrivers() {
            // بنجيب اليوزرز اللي يكونوا driver ومتاحين (is_online = true)
            const { data, error } = await supabaseClient.from('users').select('*').eq('role', 'driver').eq('is_online', true);
            if (!error && data) {
                data.forEach(driver => updateDriverOnMap(driver));
            }
        }

        // الاستماع للحركة اللايف (Realtime)
        supabaseClient.channel('live-drivers-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, payload => {
                const driver = payload.new;
                // لو التغيير حصل لكابتن
                if (driver && driver.role === 'driver') {
                    if (driver.is_online) {
                        updateDriverOnMap(driver);
                    } else {
                        removeDriverFromMap(driver.id);
                    }
                }
            }).subscribe();

        // === تحديد موقع الراكب ===
        function goToMyLocation() {
            if (navigator.geolocation) {
                document.getElementById('pickup-address').innerText = "جاري تحديد موقعك...";
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    
                    if (!userMarker) {
                        userMarker = L.circleMarker([lat, lng], { radius: 9, fillColor: "#22c55e", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1 }).addTo(map);
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }

                    const targetZoom = 15;
                    const targetPoint = map.project([lat, lng], targetZoom);
                    const offsetPixels = (0.5 - 0.27) * map.getSize().y; 
                    const newCenterPoint = L.point(targetPoint.x, targetPoint.y + offsetPixels);
                    const newCenterLatLng = map.unproject(newCenterPoint, targetZoom);

                    map.flyTo(newCenterLatLng, targetZoom, { animate: true, duration: 1.5 });
                    setTimeout(() => { map.fire('moveend'); }, 1600);
                }, () => { alert("تأكد من تشغيل الـ GPS."); });
            }
        }

        setTimeout(goToMyLocation, 500);
        setTimeout(fetchInitialDrivers, 1500); // نجيب الكباتن بعد ثانية ونص

        // === جلب اسم الشارع ===
        async function getAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&accept-language=ar`);
                const data = await res.json();
                return data.address?.road || data.address?.suburb || data.address?.city || "موقع محدد";
            } catch (e) { return "موقع محدد"; }
        }

        map.on('moveend', function() {
            clearTimeout(moveEndTimeout);
            moveEndTimeout = setTimeout(async () => {
                if (currentStep === 'pickup' || currentStep === 'dropoff') {
                    const center = map.containerPointToLatLng([map.getSize().x / 2, map.getSize().y * 0.27]);
                    
                    if (currentStep === 'pickup') document.getElementById('pickup-address').innerText = "جاري تحديد الشارع...";
                    else if (currentStep === 'dropoff') document.getElementById('dropoff-address').innerText = "جاري تحديد الشارع...";

                    const addr = await getAddress(center.lat, center.lng);
                    
                    if (currentStep === 'pickup') {
                        document.getElementById('pickup-address').innerText = addr;
                        pickupPoint = [center.lat, center.lng];
                    } else if (currentStep === 'dropoff') {
                        document.getElementById('dropoff-address').innerText = addr;
                        dropoffPoint = [center.lat, center.lng];
                    }
                }
            }, 400);
        });

        async function handleSearch(event, type) {
            if (event && event.key !== 'Enter') return;
            const inputId = type === 'pickup' ? 'search-pickup' : 'search-dropoff';
            const query = document.getElementById(inputId).value;
            if (!query.trim()) return;
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&accept-language=ar`);
                const data = await res.json();
                
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
                    const targetZoom = 16;
                    const targetPoint = map.project([lat, lon], targetZoom);
                    const offsetPixels = (0.5 - 0.27) * map.getSize().y; 
                    const newCenterPoint = L.point(targetPoint.x, targetPoint.y + offsetPixels);
                    const newCenterLatLng = map.unproject(newCenterPoint, targetZoom);
                    
                    map.flyTo(newCenterLatLng, targetZoom, { animate: true, duration: 1.5 });
                    document.activeElement.blur();
                } else { alert('لم يتم العثور على المكان.'); }
            } catch (e) { alert('خطأ في الاتصال.'); }
        }

        function confirmPickup() {
            const center = map.containerPointToLatLng([map.getSize().x / 2, map.getSize().y * 0.27]);
            if (!pickupPoint) pickupPoint = [center.lat, center.lng];
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker(pickupPoint, {icon: L.divIcon({ html: `<div style="width: 18px; height: 18px; background: #22c55e; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px #22c55e;"></div>`, iconSize: [18,18], iconAnchor: [9,9] })}).addTo(map);

            document.getElementById('confirmed-pickup-text').innerText = document.getElementById('pickup-address').innerText;
            document.getElementById('ui-pickup').style.display = 'none';
            document.getElementById('ui-dropoff').style.display = 'block';
            
            currentStep = 'dropoff';
            document.getElementById('pin-svg').setAttribute('fill', '#ff4757');
            map.fire('moveend'); 
        }

        function goBackToPickup() {
            currentStep = 'pickup';
            dropoffPoint = null;
            if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
            document.getElementById('ui-dropoff').style.display = 'none';
            document.getElementById('ui-pickup').style.display = 'block';
            document.getElementById('pin-svg').setAttribute('fill', '#0284c7');
            map.fire('moveend');
        }

        function confirmDropoff() {
            const center = map.containerPointToLatLng([map.getSize().x / 2, map.getSize().y * 0.27]);
            if (!dropoffPoint) dropoffPoint = [center.lat, center.lng];
            currentStep = 'vehicle';

            if (destMarker) map.removeLayer(destMarker);
            destMarker = L.marker(dropoffPoint, {icon: L.divIcon({ html: `<div style="width: 18px; height: 18px; background: #ff4757; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px #ff4757;"></div>`, iconSize: [18,18], iconAnchor: [9,9] })}).addTo(map);
            document.getElementById('center-pin').style.display = 'none';

            alert("جاري حساب المسار...");
        }
    </script>
</body>
</html>
