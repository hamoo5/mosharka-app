<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشاركة</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- مكتبة Supabase عشان نتصل بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 10px; margin: 0; }
        .header { background-color: #007bff; color: white; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }
        h2 { color: #333; font-size: 18px; margin: 10px 0; }
        #map { height: 350px; width: 100%; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1; }
        
        #ride-info { display: none; background-color: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        #ride-info h3 { margin: 5px 0; color: #28a745; font-size: 22px; }
        #ride-info p { margin: 5px 0; color: #555; font-size: 16px; }

        .btn { background-color: #28a745; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">تطبيق مشاركة</div>
    
    <p style="font-size: 14px; color: #666;">اضغط على الخريطة لتحديد وجهتك</p>

    <div id="map"></div>

    <div id="ride-info">
        <p>المسافة: <span id="distance-text">0</span> كم</p>
        <h3>السعر التلقائي: <span id="price-text">0</span> جنيه</h3>
    </div>

    <button id="request-btn" class="btn" style="display: none;">اطلب التوصيل الآن</button>

    <script>
        // 1. إعداد الاتصال بقاعدة البيانات (حط اللينك والمفتاح بتوعك هنا)
        const supabaseUrl = 'ضع_اللينك_هنا'; 
        const supabaseKey = 'ضع_المفتاح_هنا';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. إعداد الخريطة
        var startPoint = [30.0444, 31.2357];
        var map = L.map('map').setView(startPoint, 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.marker(startPoint).addTo(map).bindPopup('موقعك الحالي').openPopup();

        var destMarker = null;
        var routeLine = null;
        var currentDestLat = 0;
        var currentDestLng = 0;
        var currentDistance = 0;
        var currentPrice = 0;

        map.on('click', function(e) {
            currentDestLat = e.latlng.lat;
            currentDestLng = e.latlng.lng;

            if (destMarker) { map.removeLayer(destMarker); }
            if (routeLine) { map.removeLayer(routeLine); }

            destMarker = L.marker([currentDestLat, currentDestLng]).addTo(map).bindPopup('وجهتك').openPopup();
            routeLine = L.polyline([startPoint, [currentDestLat, currentDestLng]], {color: 'blue', weight: 4}).addTo(map);

            var distanceInMeters = map.distance(startPoint, [currentDestLat, currentDestLng]);
            currentDistance = (distanceInMeters / 1000).toFixed(2);

            var basePrice = 10;
            var pricePerKm = 5;
            currentPrice = Math.round(basePrice + (currentDistance * pricePerKm));

            document.getElementById('ride-info').style.display = 'block';
            document.getElementById('distance-text').innerText = currentDistance;
            document.getElementById('price-text').innerText = currentPrice;
            
            document.getElementById('request-btn').style.display = 'block';
        });

        // 3. كود إرسال الطلب لقاعدة البيانات
        document.getElementById('request-btn').addEventListener('click', async function() {
            this.innerText = 'جاري إرسال الطلب...';
            this.disabled = true;

            const { data, error } = await supabase
                .from('rides')
                .insert([
                    { 
                        distance: currentDistance, 
                        price: currentPrice, 
                        dest_lat: currentDestLat, 
                        dest_lng: currentDestLng 
                    }
                ]);

            if (error) {
                alert('حدث خطأ في إرسال الطلب: ' + error.message);
                this.innerText = 'اطلب التوصيل الآن';
                this.disabled = false;
            } else {
                alert('تم إرسال طلبك بنجاح! الكابتن هيوصلك قريب.');
                this.innerText = 'تم الطلب بنجاح';
                this.style.backgroundColor = '#6c757d'; // تغيير اللون للرمادي
            }
        });
    </script>

</body>
</html>
