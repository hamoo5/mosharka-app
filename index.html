<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشاركة</title>
    <!-- كود الخرائط المجاني Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 10px; margin: 0; }
        .header { background-color: #007bff; color: white; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }
        h2 { color: #333; }
        /* تنسيق الخريطة */
        #map { height: 400px; width: 100%; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background-color: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">تطبيق مشاركة</div>

    <h2>أهلاً بك في تطبيق التوصيل</h2>

    <!-- هنا هيظهر مكان الخريطة -->
    <div id="map"></div>

    <button class="btn">اطلب توصيل الان</button>

    <script>
        // إعداد الخريطة وتوجيهها لمدينة القاهرة (أو أي مكان)
        var map = L.map('map').setView([30.0444, 31.2357], 12);

        // تحميل شكل الخريطة المجاني
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // إضافة علامة (دبوس) على الخريطة
        L.marker([30.0444, 31.2357]).addTo(map)
            .bindPopup('موقعك الحالي')
            .openPopup();
    </script>

</body>
</html>
