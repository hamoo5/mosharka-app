<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاركة - تطبيق التوصيل</title>
        <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            margin-top: 50px;
        }
        .btn {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            width: 80%;
            max-width: 300px;
        }
        .btn:active {
            background-color: #218838;
        }
        .map-placeholder {
            background-color: #ddd;
            height: 200px;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <header>تطبيق مشاركة</header>

    <div class="container">
        <h2>أهلاً بك في تطبيق التوصيل</h2>
        <p>اطلب مشوارك الآن بضغطة زر</p>
        
        <div class="map-placeholder">
            (هنا سيتم عرض الخريطة لاحقاً)
        </div>

        <button class="btn" onclick="alert('تم طلب التوصيل بنجاح! جاري البحث عن كابتن...')">
            اطلب توصيل الآن
        </button>
    </div>

</body>
</html>
