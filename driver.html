<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توصيل مشاركة - الكابتن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131b2e; --card-border: #1f2d4a; --primary: #00f2fe; --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); --text-main: #ffffff; --text-sub: #94a3b8; --danger: #ff4757; --success: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #map { flex-grow: 1; width: 100%; height: 100vh; z-index: 1; background-color: #05070a; }
        .dark-tiles { filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4); }
        .top-nav { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-main); cursor: pointer; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 18px; z-index: 1000; text-align: center; transition: 0.3s; }
        .sheet-handle { width: 40px; height: 4px; background: var(--card-border); border-radius: 2px; margin: 0 auto 12px auto; }
        .status-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Cairo'; }
        .status-btn.offline { background: var(--card-border); color: var(--text-sub); }
        .status-btn.online { background: var(--primary-gradient); color: #fff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }

        #ride-request-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; display: none; flex-direction: column; justify-content: flex-end; }
        .request-card { background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 24px; border-top: 2px solid var(--primary); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .request-info { background: var(--bg-color); border-radius: 14px; padding: 15px; margin: 15px 0; display: flex; justify-content: space-between; text-align: center; }
        .info-value { font-size: 16px; font-weight: 800; color: var(--primary); }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-accept { background: var(--success); color: white; padding: 15px; border-radius: 14px; font-weight: 800; }
        .btn-reject { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 15px; border-radius: 14px; font-weight: 800; }

        #active-ride-sheet { display: none; }
        .rider-info-box { background: var(--bg-color); border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .call-btn { background: var(--success); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>

    <div class="top-nav"><div class="nav-btn" onclick="location.reload()">🚪</div></div>
    <div id="map"></div>

    <!-- 1. حالة الاتصال -->
    <div class="bottom-sheet" id="statusSheet">
        <div class="sheet-handle"></div>
        <h2 id="statusTitle" style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">أنت غير متصل</h2>
        <p id="statusSubtitle" style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;">اضغط على الزر لبدء استقبال الطلبات</p>
        <button id="toggleBtn" class="status-btn offline" onclick="toggleOnline()">اتصال للعمل</button>
    </div>

    <!-- 2. شاشة الرحلة النشطة -->
    <div class="bottom-sheet" id="active-ride-sheet">
        <div class="sheet-handle"></div>
        <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--primary);">أنت في رحلة الآن</h2>
        
        <div class="rider-info-box">
            <div style="text-align: right;">
                <div style="font-size: 16px; font-weight: 800;" id="active-rider-name">الراكب</div>
                <div style="font-size: 12px; color: var(--text-sub);" id="active-rider-phone">الرقم</div>
            </div>
            <a href="#" id="call-rider-btn" class="call-btn">📞</a>
        </div>

        <button id="actionBtn1" class="status-btn online" onclick="updateRideStatus('arrived')" style="margin-bottom: 10px;">وصلت لنقطة الانطلاق 📍</button>
        <button id="actionBtn2" class="status-btn online" onclick="promptStartRide()" style="display: none; margin-bottom: 10px;">بدء الرحلة 🚀</button>
        <button id="actionBtn3" class="status-btn online" onclick="updateRideStatus('completed')" style="display: none; background: var(--success);">إنهاء الرحلة 🏁</button>
    </div>

    <!-- 3. استقبال الطلبات -->
    <div id="ride-request-modal">
        <div class="request-card">
            <h2 style="color: var(--primary); text-align: center;">طلب رحلة جديد! 🔔</h2>
            <div class="request-info">
                <div><div style="font-size:11px; color:var(--text-sub);">الراكب</div><div class="info-value" id="req-rider-name">أحمد</div></div>
                <div><div style="font-size:11px; color:var(--text-sub);">المسافة</div><div class="info-value" id="req-distance">5 كم</div></div>
                <div><div style="font-size:11px; color:var(--text-sub);">السعر</div><div class="info-value" id="req-price">45 ج.م</div></div>
            </div>
            <div class="action-buttons">
                <button class="btn-reject" onclick="rejectRide()">رفض</button>
                <button class="btn-accept" onclick="acceptRide()">قبول الرحلة</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const driverId = 1; const driverName = "كابتن أحمد";
        let isOnline = false; let map, driverMarker, routeLine, watchId, currentRequest;

        map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 15); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        document.getElementById('map').classList.add('dark-tiles');

        function startTracking() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (!driverMarker) {
                        driverMarker = L.marker([lat, lng], {icon: L.divIcon({ html: `<div style="width: 40px; height: 40px; background: #00f2fe; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px #00f2fe; display: flex; justify-content: center; align-items: center; font-size: 20px;">🚗</div>`, iconSize: [40, 40], iconAnchor: [20, 20] })}).addTo(map);
                        map.setView([lat, lng], 16);
                    } else { driverMarker.setLatLng([lat, lng]); }
                    if (isOnline) updateLocationInDB(lat, lng);
                }, null, { enableHighAccuracy: true });
            }
        }

        async function updateLocationInDB(lat, lng) { await supabaseClient.from('users').update({ lat, lng, is_online: true }).eq('id', driverId); }

        async function toggleOnline() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleBtn');
            if (isOnline) {
                btn.className = 'status-btn online'; btn.innerText = 'أنت متصل الآن (أونلاين)';
                document.getElementById('statusTitle').innerText = 'جاري البحث عن رحلات...';
                if (driverMarker) { const pos = driverMarker.getLatLng(); await updateLocationInDB(pos.lat, pos.lng); }
            } else {
                btn.className = 'status-btn offline'; btn.innerText = 'اتصال للعمل';
                document.getElementById('statusTitle').innerText = 'أنت غير متصل';
                await supabaseClient.from('users').update({ is_online: false }).eq('id', driverId);
            }
        }

        supabaseClient.channel('driver-rides-channel').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rides' }, payload => {
            if (payload.new.status === 'pending' && isOnline) {
                currentRequest = payload.new;
                document.getElementById('req-rider-name').innerText = currentRequest.rider_name;
                document.getElementById('req-distance').innerText = `${currentRequest.distance} كم`;
                document.getElementById('req-price').innerText = `${currentRequest.price} ج.م`;
                document.getElementById('ride-request-modal').style.display = 'flex';
            }
        }).subscribe();

        async function acceptRide() {
            if (!currentRequest) return;
            await supabaseClient.from('rides').update({ status: 'accepted', driver_name: driverName, driver_phone: "01000000000" }).eq('id', currentRequest.id);
            document.getElementById('ride-request-modal').style.display = 'none';
            document.getElementById('statusSheet').style.display = 'none';
            document.getElementById('active-ride-sheet').style.display = 'block';
            document.getElementById('active-rider-name').innerText = currentRequest.rider_name;
            document.getElementById('active-rider-phone').innerText = currentRequest.rider_phone;
            document.getElementById('call-rider-btn').href = 'tel:' + currentRequest.rider_phone;
            drawRouteToRider(currentRequest.pickup_lat, currentRequest.pickup_lng);
        }

        function rejectRide() { document.getElementById('ride-request-modal').style.display = 'none'; currentRequest = null; }

        async function drawRouteToRider(destLat, destLng) {
            if (routeLine) map.removeLayer(routeLine);
            const pos = driverMarker.getLatLng();
            const coords = `${pos.lng},${pos.lat};${destLng},${destLat}`;
            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code === 'Ok') {
                    routeLine = L.geoJSON(data.routes[0].geometry, { style: { color: '#00f2fe', weight: 8, opacity: 1 } }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }
            } catch (e) { console.log(e); }
        }

        async function updateRideStatus(newStatus) {
            if (!currentRequest) return;
            await supabaseClient.from('rides').update({ status: newStatus }).eq('id', currentRequest.id);
            if (newStatus === 'arrived') {
                document.getElementById('actionBtn1').style.display = 'none';
                document.getElementById('actionBtn2').style.display = 'flex';
            } else if (newStatus === 'completed') {
                alert("تم إنهاء الرحلة بنجاح!"); location.reload();
            }
        }

        // --- تأكيد الـ PIN لبدء الرحلة ---
        function promptStartRide() {
            if (!currentRequest) return;
            let enteredPin = prompt("برجاء إدخال رمز الـ PIN المكون من 4 أرقام من الراكب لبدء الرحلة:");
            
            if (enteredPin === currentRequest.pin_code) {
                // الرقم صح، ابدأ الرحلة
                supabaseClient.from('rides').update({ status: 'started' }).eq('id', currentRequest.id).then(() => {
                    document.getElementById('actionBtn2').style.display = 'none';
                    document.getElementById('actionBtn3').style.display = 'flex';
                    if (routeLine) map.removeLayer(routeLine);
                    alert("تم بدء الرحلة بنجاح! 🚀");
                });
            } else if (enteredPin !== null) {
                // المستخدم كتب رقم غلط
                alert("رقم PIN غير صحيح، برجاء التأكد من الراكب.");
            }
        }

        window.onload = startTracking;
    </script>
</body>
</html>
