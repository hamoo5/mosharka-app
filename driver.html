<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توصيل مشاركة - الكابتن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131b2e; --card-border: #1f2d4a; --primary: #00f2fe; --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); --text-main: #ffffff; --text-sub: #94a3b8; --danger: #ff4757; --success: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map { flex-grow: 1; width: 100%; height: 100vh; z-index: 1; background-color: #05070a; }
        .dark-tiles { filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4); }
        .light-tiles { filter: none; }

        .top-nav { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; pointer-events: none;}
        .nav-left, .nav-right { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-main); cursor: pointer; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);}

        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 18px; z-index: 1000; text-align: center; transition: 0.3s; }
        .sheet-handle { width: 40px; height: 4px; background: var(--card-border); border-radius: 2px; margin: 0 auto 12px auto; }
        .status-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Cairo'; }
        .status-btn.offline { background: var(--card-border); color: var(--text-sub); }
        .status-btn.online { background: var(--primary-gradient); color: #fff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }
        .status-btn.cancel { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 10px; }

        #active-ride-sheet { display: none; }
        .rider-info-box { background: var(--bg-color); border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .call-btn { background: var(--success); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 20px; }
        .trip-stats-bar { display: flex; justify-content: space-between; background: var(--bg-color); padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--card-border); font-size: 14px; font-weight: 700; color: var(--primary); }

        #available-rides-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); z-index: 3000; display: none; flex-direction: column; }
        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--card-border); }
        .list-container { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .ride-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 15px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: 0.2s; }
        .ride-card:active { transform: scale(0.98); }
        .ride-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
        .ride-price { font-size: 22px; font-weight: 800; color: var(--primary); }
        .ride-distance { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .ride-details { display: flex; gap: 10px; }
        .rider-avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .address-box { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-sub); }
        .address-row { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-green { background: var(--success); }
        .dot-red { background: var(--danger); }

        #ride-detail-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 20px; z-index: 2000; display: none; text-align: center; border-top: 2px solid var(--primary); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .btn-accept-ride { width: 100%; padding: 15px; border-radius: 14px; border: none; background: #22c55e; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 15px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 4000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 24px; width: 100%; max-width: 350px; position: relative; text-align: center;}
        .modal-close { position: absolute; top: 15px; left: 15px; color: var(--text-sub); font-size: 20px; cursor: pointer; background: none; border: none; }
        .input-group { display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 10px; padding: 3px 10px 3px 4px; }
        .input-group input { width: 100%; background: transparent; border: none; padding: 12px; color: var(--text-main); font-size: 18px; outline: none; font-weight: 800; text-align: center; letter-spacing: 5px;}
    </style>
</head>
<body>

    <audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>

    <script>
        const loggedUser = JSON.parse(localStorage.getItem('mosharka_user'));
        if (!loggedUser || loggedUser.role !== 'driver') { window.location.href = 'login.html'; }
        if (!loggedUser.name || loggedUser.name.trim() === '') loggedUser.name = "كابتن جديد";
    </script>

    <div class="top-nav">
        <div class="nav-left">
            <div class="nav-btn" onclick="logout()" title="خروج">🚪</div>
        </div>
        <div class="nav-right">
            <button id="themeToggle" class="nav-btn" onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet" id="statusSheet">
        <div class="sheet-handle"></div>
        <h2 id="statusTitle" style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">أنت غير متصل</h2>
        <p id="statusSubtitle" style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;">اضغط على الزر لبدء استقبال الطلبات</p>
        <button id="toggleBtn" class="status-btn offline" onclick="toggleOnline()">اتصال للعمل</button>
        <button id="showListBtn" class="status-btn online" onclick="openRidesList()" style="display: none; margin-top: 10px; background: #fff; color: #000;">عرض الطلبات المتاحة (<span id="availableCount">0</span>)</button>
    </div>

    <div class="bottom-sheet" id="active-ride-sheet">
        <div class="sheet-handle"></div>
        <div class="trip-stats-bar" id="tripStatsBar">
            <span id="driverTripDistance">... كم</span>
            <span id="driverTripTime">... دقيقة</span>
        </div>
        <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--primary);" id="ridePhaseTitle">أنت في الطريق للراكب</h2>
        <div class="rider-info-box">
            <div style="text-align: right;">
                <div style="font-size: 16px; font-weight: 800;" id="active-rider-name">الراكب</div>
                <div style="font-size: 12px; color: var(--text-sub);" id="active-rider-phone">الرقم</div>
            </div>
            <a href="#" id="call-rider-btn" onclick="openCallModal()" class="call-btn">📞</a>
        </div>
        <button id="actionBtn1" class="status-btn online" onclick="updateRideStatus('arrived')" style="margin-bottom: 10px;">وصلت لنقطة الانطلاق 📍</button>
        <button id="actionBtn2" class="status-btn online" onclick="showPinModal()" style="display: none; margin-bottom: 10px;">بدء الرحلة 🚀</button>
        <button id="actionBtn3" class="status-btn online" onclick="updateRideStatus('completed')" style="display: none; background: var(--success);">إنهاء الرحلة 🏁</button>
        
        <button id="cancelRideBtn" class="status-btn cancel" onclick="driverCancelRide()">إلغاء الرحلة</button>
    </div>

    <div id="available-rides-screen">
        <div class="list-header">
            <h2 style="font-size: 20px; color: var(--primary);">طلبات الركوب المتاحة</h2>
            <button onclick="closeRidesList()" style="background: transparent; border: none; color: var(--danger); font-size: 24px;">✖</button>
        </div>
        <div class="list-container" id="rides-list-container">
            <p style="text-align: center; color: var(--text-sub); margin-top: 50px;">جاري البحث عن طلبات...</p>
        </div>
    </div>

    <div id="ride-detail-sheet">
        <h2 style="font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 5px;" id="detail-price">110 EGP</h2>
        <p style="font-size: 14px; color: var(--text-main); margin-bottom: 15px;" id="detail-rider-name">اسم الراكب</p>
        
        <div class="address-box" style="text-align: right; margin-bottom: 20px;">
            <div class="address-row"><div class="dot dot-green"></div> <span id="detail-pickup">مكان الانطلاق</span></div>
            <div class="address-row"><div class="dot dot-red"></div> <span id="detail-dropoff">مكان الوصول</span></div>
        </div>

        <button class="btn-accept-ride" id="acceptBtn" onclick="acceptSelectedRide()">قبول الرحلة</button>
        <button style="width: 100%; padding: 10px; margin-top: 10px; background: transparent; border: none; color: var(--text-sub); cursor: pointer;" onclick="closeRideDetail()">إغلاق</button>
    </div>

    <div id="pinModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closePinModal()">✖</button>
            <h2 style="font-size: 20px; margin-bottom: 10px; color: var(--primary);">بدء الرحلة</h2>
            <p style="font-size: 13px; color: var(--text-sub); margin-bottom: 20px;">برجاء إدخال رمز الـ PIN من الراكب.</p>
            <div class="input-group">
                <input type="tel" id="pinInput" maxlength="4" placeholder="----">
            </div>
            <button class="btn-accept" style="width: 100%; margin-top: 10px; background: #22c55e; color: #fff; border: none; padding: 15px; border-radius: 14px; font-weight: 800; cursor: pointer;" onclick="submitPin()">تأكيد وبدء الرحلة</button>
        </div>
    </div>

    <div id="callModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeCallModal()">✖</button>
            <div style="width: 80px; height: 80px; background: rgba(34, 197, 94, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto; font-size: 35px;">📞</div>
            <h2 style="font-size: 20px; margin-bottom: 5px;">جاري الاتصال...</h2>
            <p id="callRiderName" style="color: var(--text-sub); margin-bottom: 25px;">بالراكب</p>
            <a href="#" id="confirmCallBtn" style="text-decoration: none; display: block; text-align: center; background: #22c55e; color: white; padding: 15px; border-radius: 14px; font-weight: 800;">بدء الاتصال</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const driverPhone = loggedUser.phone; 
        const driverName = loggedUser.name; 
        
        let isOnline = false; 
        let map, driverMarker, watchId;
        let currentRequest = null; 
        let selectedRequest = null; 
        let availableRides = []; 
        
        let reqMarker1 = null, reqMarker2 = null, reqRoute = null; 
        let isDark = true;
        let locationInterval = null;
        let lastSent = 0; 

        map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 15); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        document.getElementById('map').classList.add('dark-tiles');

        function toggleTheme() {
            isDark = !isDark;
            const btn = document.getElementById('themeToggle');
            const mapDiv = document.getElementById('map');
            if (isDark) { mapDiv.classList.add('dark-tiles'); mapDiv.classList.remove('light-tiles'); btn.textContent = '🌙'; }
            else { mapDiv.classList.remove('dark-tiles'); mapDiv.classList.add('light-tiles'); btn.textContent = '☀️'; }
        }

        function startTracking() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(async pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (!driverMarker) {
                        driverMarker = L.marker([lat, lng], {icon: L.divIcon({ html: `<div style="width: 40px; height: 40px; background: #00f2fe; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px #00f2fe; display: flex; justify-content: center; align-items: center; font-size: 20px;">🚗</div>`, iconSize: [40, 40], iconAnchor: [20, 20] })}).addTo(map);
                        map.setView([lat, lng], 16);
                        
                        if (currentRequest) {
                            if(currentRequest.status === 'accepted' || currentRequest.status === 'pending') {
                                drawRouteToRider(currentRequest.pickup_lat, currentRequest.pickup_lng);
                            } else if (currentRequest.status === 'started') {
                                drawRouteToDestination(currentRequest.dest_lat, currentRequest.dest_lng);
                            }
                        }
                    } else { 
                        driverMarker.setLatLng([lat, lng]); 
                    }

                    if (isOnline && Date.now() - lastSent > 2000) {
                        lastSent = Date.now();
                        await supabaseClient.from('users').update({ 
                            lat, lng, is_online: true, 
                            last_seen: new Date().toISOString() 
                        }).eq('phone', driverPhone);
                    }
                }, null, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
            }
        }

        function syncLocationToServer() {
            if (locationInterval) clearInterval(locationInterval);
            locationInterval = setInterval(async () => {
                if (isOnline && driverMarker) {
                    const pos = driverMarker.getLatLng();
                    await supabaseClient.from('users').update({ 
                        lat: pos.lat, 
                        lng: pos.lng, 
                        is_online: true,
                        last_seen: new Date().toISOString() 
                    }).eq('phone', driverPhone);
                    
                    if(!currentRequest && !selectedRequest) fetchAvailableRides();
                }
            }, 5000); 
        }

        async function toggleOnline() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleBtn');
            const listBtn = document.getElementById('showListBtn');
            
            if (isOnline) {
                btn.className = 'status-btn offline'; btn.innerText = 'إيقاف العمل (أوفلاين)';
                document.getElementById('statusTitle').innerText = 'أنت متصل الآن';
                document.getElementById('statusSubtitle').innerText = 'اضغط لعرض الطلبات المتاحة';
                listBtn.style.display = 'flex';
                
                if (driverMarker) { 
                    const pos = driverMarker.getLatLng(); 
                    await supabaseClient.from('users').update({ lat: pos.lat, lng: pos.lng, is_online: true, last_seen: new Date().toISOString() }).eq('phone', driverPhone); 
                }
                fetchAvailableRides();
                syncLocationToServer();
            } else {
                btn.className = 'status-btn online'; btn.innerText = 'اتصال للعمل';
                document.getElementById('statusTitle').innerText = 'أنت غير متصل';
                document.getElementById('statusSubtitle').innerText = 'اضغط على الزر لبدء استقبال الطلبات';
                listBtn.style.display = 'none';
                closeRidesList();
                await supabaseClient.from('users').update({ is_online: false }).eq('phone', driverPhone);
                if (locationInterval) clearInterval(locationInterval);
            }
        }

        async function fetchAvailableRides() {
            const fiveMinsAgo = new Date(Date.now() - 5 * 60000).toISOString();
            const { data, error } = await supabaseClient
                .from('rides')
                .select('*')
                .eq('status', 'pending')
                .gte('created_at', fiveMinsAgo)
                .order('created_at', { ascending: false });
                
            if (!error && data) {
                availableRides = data;
                document.getElementById('availableCount').innerText = availableRides.length;
                renderRidesList();
            }
        }

        function renderRidesList() {
            const container = document.getElementById('rides-list-container');
            if (availableRides.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-sub); margin-top: 50px;">لا يوجد طلبات متاحة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            availableRides.forEach(ride => {
                const card = document.createElement('div');
                card.className = 'ride-card';
                card.onclick = () => selectRideFromList(ride);
                card.innerHTML = `
                    <div class="ride-card-header">
                        <div class="ride-price">${ride.price} ج.م</div>
                        <div class="ride-distance">المسافة: ${ride.distance} كم</div>
                    </div>
                    <div class="ride-details">
                        <div class="rider-avatar">👤</div>
                        <div class="address-box">
                            <div class="address-row"><div class="dot dot-green"></div> <span style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${ride.rider_name || 'راكب'}</span></div>
                            <div class="address-row"><div class="dot dot-red"></div> <span>الوجهة: حددت</span></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openRidesList() {
            document.getElementById('available-rides-screen').style.display = 'flex';
            fetchAvailableRides();
        }
        function closeRidesList() {
            document.getElementById('available-rides-screen').style.display = 'none';
        }

        function selectRideFromList(ride) {
            selectedRequest = ride;
            closeRidesList();
            
            document.getElementById('ride-detail-sheet').style.display = 'block';
            document.getElementById('detail-price').innerText = `${ride.price} ج.م`;
            document.getElementById('detail-rider-name').innerText = ride.rider_name || 'راكب جديد';
            document.getElementById('detail-pickup').innerText = `موقع الراكب الحالي`;
            document.getElementById('detail-dropoff').innerText = `وجهة الراكب`;

            drawDetailedRouteForSelectedRide(ride);
        }

        function closeRideDetail() {
            document.getElementById('ride-detail-sheet').style.display = 'none';
            selectedRequest = null;
            if (reqRoute) { map.removeLayer(reqRoute); reqRoute = null; }
            if (reqMarker1) { map.removeLayer(reqMarker1); reqMarker1 = null; }
            if (reqMarker2) { map.removeLayer(reqMarker2); reqMarker2 = null; }
            if (driverMarker) map.setView(driverMarker.getLatLng(), 16);
            openRidesList();
        }

        async function drawDetailedRouteForSelectedRide(ride) {
            if (reqMarker1) map.removeLayer(reqMarker1);
            if (reqMarker2) map.removeLayer(reqMarker2);
            if (reqRoute) map.removeLayer(reqRoute);

            const pickupIcon = L.divIcon({ html: `<div style="width: 24px; height: 24px; background: #22c55e; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px #22c55e; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold;">A</div>`, iconSize: [24,24], iconAnchor: [12,12] });
            const dropoffIcon = L.divIcon({ html: `<div style="width: 24px; height: 24px; background: #ff4757; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px #ff4757; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold;">B</div>`, iconSize: [24,24], iconAnchor: [12,12] });

            reqMarker1 = L.marker([ride.pickup_lat, ride.pickup_lng], {icon: pickupIcon}).addTo(map);
            reqMarker2 = L.marker([ride.dest_lat, ride.dest_lng], {icon: dropoffIcon}).addTo(map);

            const pos = driverMarker ? driverMarker.getLatLng() : {lat: ride.pickup_lat, lng: ride.pickup_lng};
            const coords = `${pos.lng},${pos.lat};${ride.pickup_lng},${ride.pickup_lat};${ride.dest_lng},${ride.dest_lat}`;

            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes.length > 0) {
                    reqRoute = L.geoJSON(data.routes[0].geometry, { style: { color: '#00f2fe', weight: 6, opacity: 0.9 } }).addTo(map);
                    map.fitBounds(reqRoute.getBounds(), { paddingTopLeft: [40, 100], paddingBottomRight: [40, window.innerHeight * 0.4] });
                }
            } catch(e) { console.log(e); }
        }

        async function acceptSelectedRide() {
            if (!selectedRequest) return;
            
            const { data, error } = await supabaseClient.from('rides')
                .update({ status: 'accepted', driver_name: driverName, driver_phone: driverPhone })
                .eq('id', selectedRequest.id)
                .eq('status', 'pending')
                .select();
                
            if (error || !data || data.length === 0) {
                alert("عذراً، هذه الرحلة تم قبولها من كابتن آخر أو انتهت صلاحيتها.");
                closeRideDetail();
                return;
            }
            
            currentRequest = data[0];
            selectedRequest = null;
            
            document.getElementById('ride-detail-sheet').style.display = 'none';
            document.getElementById('statusSheet').style.display = 'none';
            document.getElementById('active-ride-sheet').style.display = 'block';
            
            document.getElementById('active-rider-name').innerText = currentRequest.rider_name || 'راكب جديد';
            document.getElementById('active-rider-phone').innerText = currentRequest.rider_phone || '01000000000';
            document.getElementById('call-rider-btn').href = 'tel:' + (currentRequest.rider_phone || '01000000000');
            document.getElementById('ridePhaseTitle').innerText = "أنت في الطريق للراكب";
            
            if (reqMarker2) { map.removeLayer(reqMarker2); reqMarker2 = null; } 
            drawRouteToRider(currentRequest.pickup_lat, currentRequest.pickup_lng);
        }

        function openCallModal() {
            const riderName = document.getElementById('active-rider-name').innerText;
            const riderPhone = document.getElementById('call-rider-btn').href.replace('tel:', '');
            document.getElementById('callRiderName').innerText = "مع " + riderName;
            document.getElementById('confirmCallBtn').href = "tel:" + riderPhone;
            document.getElementById('callModal').style.display = 'flex';
        }
        function closeCallModal() { document.getElementById('callModal').style.display = 'none'; }

        function showPinModal() { document.getElementById('pinInput').value = ''; document.getElementById('pinModal').style.display = 'flex'; setTimeout(() => document.getElementById('pinInput').focus(), 100); }
        function closePinModal() { document.getElementById('pinModal').style.display = 'none'; }
        
        function submitPin() {
            if (!currentRequest) return;
            const enteredPin = document.getElementById('pinInput').value.trim();
            if (enteredPin === currentRequest.pin_code) {
                supabaseClient.from('rides').update({ status: 'started' }).eq('id', currentRequest.id).then(() => {
                    closePinModal();
                    document.getElementById('actionBtn2').style.display = 'none';
                    document.getElementById('actionBtn3').style.display = 'flex';
                    document.getElementById('ridePhaseTitle').innerText = "أنت في الطريق للوجهة";
                    
                    if (reqMarker1) { map.removeLayer(reqMarker1); reqMarker1 = null; }
                    drawRouteToDestination(currentRequest.dest_lat, currentRequest.dest_lng);
                    alert("تم بدء الرحلة بنجاح! 🚀");
                });
            } else { alert("رقم PIN غير صحيح، برجاء التأكد من الراكب."); }
        }

        async function driverCancelRide() {
            if (!currentRequest) return;
            if (confirm("هل أنت متأكد من إلغاء الرحلة؟")) {
                await supabaseClient.from('rides').update({ status: 'cancelled' }).eq('id', currentRequest.id);
                alert("تم إلغاء الرحلة.");
                resetDriverUI();
            }
        }

        function resetDriverUI() {
            currentRequest = null;
            isOnline = true; 
            
            document.getElementById('active-ride-sheet').style.display = 'none';
            document.getElementById('statusSheet').style.display = 'block';
            document.getElementById('toggleBtn').className = 'status-btn offline'; 
            document.getElementById('toggleBtn').innerText = 'إيقاف العمل (أوفلاين)';
            document.getElementById('statusTitle').innerText = 'أنت متصل الآن';
            document.getElementById('statusSubtitle').innerText = 'اضغط لعرض الطلبات المتاحة';
            document.getElementById('showListBtn').style.display = 'flex';
            
            document.getElementById('actionBtn1').style.display = 'block';
            document.getElementById('actionBtn2').style.display = 'none';
            document.getElementById('actionBtn3').style.display = 'none';
            document.getElementById('ridePhaseTitle').innerText = "أنت في الطريق للراكب";

            if (reqMarker1) { map.removeLayer(reqMarker1); reqMarker1 = null; }
            if (reqMarker2) { map.removeLayer(reqMarker2); reqMarker2 = null; }
            if (reqRoute) { map.removeLayer(reqRoute); reqRoute = null; }
            
            if (driverMarker) {
                const pos = driverMarker.getLatLng();
                supabaseClient.from('users').update({ lat: pos.lat, lng: pos.lng, is_online: true, last_seen: new Date().toISOString() }).eq('phone', driverPhone);
            }
            
            fetchAvailableRides();
        }

        async function updateRideStatus(newStatus) {
            if (!currentRequest) return;
            
            let updateData = { status: newStatus };
            if (newStatus === 'arrived') {
                updateData.arrived_at = new Date().toISOString();
            }
            
            await supabaseClient.from('rides').update(updateData).eq('id', currentRequest.id);
            
            if (newStatus === 'arrived') {
                document.getElementById('actionBtn1').style.display = 'none';
                document.getElementById('actionBtn2').style.display = 'flex';
                document.getElementById('ridePhaseTitle').innerText = "أنت في انتظار الراكب";
            } else if (newStatus === 'completed') {
                alert("تم إنهاء الرحلة بنجاح! جاري استقبال طلبات جديدة."); 
                resetDriverUI();
            }
        }

        function updateTripStats(distKm, timeMin) {
            document.getElementById('driverTripDistance').innerText = `${distKm} كم`;
            document.getElementById('driverTripTime').innerText = `${timeMin} دقيقة`;
        }

        async function drawRouteToRider(destLat, destLng) {
            if (reqRoute) map.removeLayer(reqRoute);
            const pos = driverMarker ? driverMarker.getLatLng() : { lat: currentRequest.pickup_lat, lng: currentRequest.pickup_lng };
            const coords = `${pos.lng},${pos.lat};${destLng},${destLat}`;
            
            const straightDist = (map.distance([pos.lat, pos.lng], [destLat, destLng]) / 1000).toFixed(1);
            updateTripStats(straightDist, Math.round((straightDist/30)*60));

            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes.length > 0) {
                    const route = data.routes[0];
                    updateTripStats(parseFloat((route.distance / 1000).toFixed(1)), Math.round(route.duration / 60));
                    reqRoute = L.geoJSON(route.geometry, { style: { color: '#00f2fe', weight: 8, opacity: 1 } }).addTo(map);
                    map.fitBounds(reqRoute.getBounds(), { paddingTopLeft: [40, 100], paddingBottomRight: [40, window.innerHeight * 0.4] });
                }
            } catch (e) {
                reqRoute = L.polyline([[pos.lat, pos.lng], [destLat, destLng]], {color: '#00f2fe', weight: 8}).addTo(map);
            }
        }

        async function drawRouteToDestination(destLat, destLng) {
            if (reqRoute) map.removeLayer(reqRoute);
            const pos = driverMarker ? driverMarker.getLatLng() : { lat: currentRequest.pickup_lat, lng: currentRequest.pickup_lng };
            const coords = `${pos.lng},${pos.lat};${destLng},${destLat}`;
            
            const straightDist = (map.distance([pos.lat, pos.lng], [destLat, destLng]) / 1000).toFixed(1);
            updateTripStats(straightDist, Math.round((straightDist/30)*60));

            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes.length > 0) { 
                    const route = data.routes[0];
                    updateTripStats(parseFloat((route.distance / 1000).toFixed(1)), Math.round(route.duration / 60));
                    reqRoute = L.geoJSON(route.geometry, { style: { color: '#00f2fe', weight: 8, opacity: 1 } }).addTo(map);
                    map.fitBounds(reqRoute.getBounds(), { paddingTopLeft: [40, 100], paddingBottomRight: [40, window.innerHeight * 0.4] });
                }
            } catch (e) {
                reqRoute = L.polyline([[pos.lat, pos.lng], [destLat, destLng]], {color: '#00f2fe', weight: 8}).addTo(map);
            }
        }

        supabaseClient.channel('driver-rides-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'rides' }, payload => {
            if (payload.eventType === 'INSERT') {
                if (payload.new.status === 'pending' && isOnline && !currentRequest) {
                    fetchAvailableRides(); 
                }
            } else if (payload.eventType === 'UPDATE') {
                if (payload.new.status !== 'pending' && !currentRequest) {
                    fetchAvailableRides(); 
                }
                if (currentRequest && payload.new.id === currentRequest.id && payload.new.status === 'cancelled') {
                    alert("قام الراكب بإلغاء الرحلة.");
                    resetDriverUI();
                }
            }
        }).subscribe();

        async function checkDriverActiveRide() {
            const { data, error } = await supabaseClient.from('rides')
                .select('*')
                .eq('driver_phone', loggedUser.phone)
                .in('status', ['accepted', 'arrived', 'started'])
                .order('created_at', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                currentRequest = data[0];
                isOnline = true; 
                
                document.getElementById('statusTitle').innerText = 'أنت متصل الآن';
                document.getElementById('statusSubtitle').innerText = 'لديك رحلة نشطة';
                document.getElementById('toggleBtn').className = 'status-btn offline';
                document.getElementById('toggleBtn').innerText = 'إيقاف العمل (أوفلاين)';
                document.getElementById('showListBtn').style.display = 'flex';

                document.getElementById('statusSheet').style.display = 'none';
                document.getElementById('active-ride-sheet').style.display = 'block';
                document.getElementById('active-rider-name').innerText = currentRequest.rider_name || 'راكب جديد';
                document.getElementById('active-rider-phone').innerText = currentRequest.rider_phone || '01000000000';
                document.getElementById('call-rider-btn').href = 'tel:' + (currentRequest.rider_phone || '01000000000');

                if (currentRequest.status === 'accepted') {
                    document.getElementById('ridePhaseTitle').innerText = "أنت في الطريق للراكب";
                    document.getElementById('actionBtn1').style.display = 'block';
                    document.getElementById('actionBtn2').style.display = 'none';
                    document.getElementById('actionBtn3').style.display = 'none';
                    setTimeout(() => { drawRouteToRider(currentRequest.pickup_lat, currentRequest.pickup_lng); }, 1500);
                } else if (currentRequest.status === 'arrived') {
                    document.getElementById('ridePhaseTitle').innerText = "أنت في انتظار الراكب";
                    document.getElementById('actionBtn1').style.display = 'none';
                    document.getElementById('actionBtn2').style.display = 'block';
                    document.getElementById('actionBtn3').style.display = 'none';
                } else if (currentRequest.status === 'started') {
                    document.getElementById('ridePhaseTitle').innerText = "أنت في الطريق للوجهة";
                    document.getElementById('actionBtn1').style.display = 'none';
                    document.getElementById('actionBtn2').style.display = 'none';
                    document.getElementById('actionBtn3').style.display = 'block';
                    setTimeout(() => { drawRouteToDestination(currentRequest.dest_lat, currentRequest.dest_lng); }, 1500);
                }
                syncLocationToServer();
            } else {
                isOnline = false;
                await supabaseClient.from('users').update({ is_online: false }).eq('phone', driverPhone);
                
                document.getElementById('statusTitle').innerText = 'أنت غير متصل';
                document.getElementById('statusSubtitle').innerText = 'اضغط على الزر لبدء استقبال الطلبات';
                document.getElementById('toggleBtn').className = 'status-btn online';
                document.getElementById('toggleBtn').innerText = 'اتصال للعمل';
                document.getElementById('showListBtn').style.display = 'none';
            }
        }

        function logout() {
            if(confirm("هل تريد الخروج من التطبيق؟")) {
                localStorage.removeItem('mosharka_user');
                window.location.href = 'login.html';
            }
        }

        window.onload = function() {
            startTracking();
            setTimeout(() => { checkDriverActiveRide(); }, 2000); 
            setTimeout(() => {
                if (isOnline) syncLocationToServer();
            }, 2500);
        };
    </script>
</body>
</html>
