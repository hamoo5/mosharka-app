<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشاركة - الكابتن</title>
    <link rel="manifest" href="manifest-driver.json">
    <meta name="theme-color" content="#1A237E">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; padding: 15px; margin: 0; text-align: center; }
        .header { background-color: #1A237E; color: white; padding: 15px; font-size: 22px; font-weight: bold; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        .profile-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        .ride-card { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; text-align: right; border-right: 6px solid #FFC107; transition: 0.3s; }
        .ride-card.accepted { border-right-color: #28a745; background-color: #f0fff4; }
        .ride-card h3 { margin: 0 0 10px 0; color: #1A237E; }
        .ride-card p { margin: 8px 0; color: #555; font-size: 16px; }
        .price { color: #28a745; font-weight: bold; font-size: 20px; }
        .btn-accept { background-color: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .btn-finish { background-color: #dc3545; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .map-links a { display: block; margin: 5px 0; background: #e3f2fd; padding: 10px; border-radius: 5px; text-decoration: none; color: #1A237E; font-weight: bold;}
        .logout-btn { position: absolute; left: 15px; top: 18px; background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'driver') {
            window.location.href = 'login.html';
        }
    </script>

    <div class="header">
        لوحة الكابتن
        <a href="#" onclick="logout()" class="logout-btn">خروج</a>
    </div>
    
    <div class="profile-box" id="profileBox">
        <input type="hidden" id="driverName">
        <input type="hidden" id="driverPhone">
    </div>

    <div id="orders-container">
        <p>جاري تحميل الطلبات...</p>
    </div>

    <script>
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('driverName').value = user.name;
        document.getElementById('driverPhone').value = user.phone;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function fetchOrders() {
            const { data, error } = await supabaseClient
                .from('rides')
                .select('*')
                .in('status', ['pending', 'accepted'])
                .order('created_at', { ascending: false });

            const container = document.getElementById('orders-container');
            
            if (error) { container.innerHTML = '<p>حدث خطأ في جلب البيانات</p>'; return; }
            if (data.length === 0) { container.innerHTML = '<p style="color:#777;">لا توجد طلبات جديدة حالياً.</p>'; return; }

            container.innerHTML = '';
            data.forEach(ride => {
                const pLat = ride.pickup_lat || 0;
                const pLng = ride.pickup_lng || 0;
                const isAccepted = ride.status === 'accepted';

                container.innerHTML += `
                    <div class="ride-card ${isAccepted ? 'accepted' : ''}" id="card-${ride.id}">
                        <h3>${isAccepted ? 'مشوار جاري 🚗' : 'طلب مشوار جديد'}</h3>
                        <p>المسافة: <b>${ride.distance} كم</b></p>
                        <p class="price">السعر: ${ride.price} جنيه</p>
                        
                        <div class="map-links">
                            <a href="https://www.google.com/maps?q=${pLat},${pLng}" target="_blank">📍 مكان الراكب</a>
                            <a href="https://www.google.com/maps?q=${ride.dest_lat},${ride.dest_lng}" target="_blank">🏁 مكان الوجهة</a>
                        </div>

                        ${isAccepted 
                            ? `<button class="btn-finish" onclick="finishRide(${ride.id})">إنهاء الرحلة</button>` 
                            : `<button class="btn-accept" onclick="acceptRide(${ride.id})">قبول المشوار</button>`
                        }
                    </div>
                `;
            });
        }

        async function acceptRide(rideId) {
            const dName = document.getElementById('driverName').value;
            const dPhone = document.getElementById('driverPhone').value;

            const { error } = await supabaseClient
                .from('rides')
                .update({ status: 'accepted', driver_name: dName, driver_phone: dPhone })
                .eq('id', rideId);

            if (error) { alert('حدث خطأ، حاول مرة أخرى.'); }
            fetchOrders(); 
        }

        async function finishRide(rideId) {
            if(!confirm('هل أنت متأكد من إنهاء الرحلة؟')) return;
            const { error } = await supabaseClient.from('rides').update({ status: 'completed' }).eq('id', rideId);
            if (error) { alert('حدث خطأ.'); }
            fetchOrders();
        }

        fetchOrders();
        supabaseClient.channel('driver-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'rides' }, () => { fetchOrders(); }).subscribe();
    </script>
</body>
</html>
