<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>توصيل مشاركة - الكابتن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #1f2d4a;
            --primary: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ff4757;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #map { flex-grow: 1; width: 100%; height: 100vh; z-index: 1; background-color: #05070a; }
        .dark-tiles { filter: brightness(0.65) invert(1) contrast(1.3) hue-rotate(200deg) saturate(0.4); }

        .top-nav { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }

        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 28px 28px 0 0; padding: 18px; z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); border-top: 1px solid var(--card-border); text-align: center; }
        .sheet-handle { width: 40px; height: 4px; background: var(--card-border); border-radius: 2px; margin: 0 auto 12px auto; }
        
        .status-btn { width: 100%; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; font-family: 'Cairo'; }
        .status-btn.offline { background: var(--card-border); color: var(--text-sub); }
        .status-btn.online { background: var(--primary-gradient); color: #fff; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-btn" onclick="logout()" title="خروج">🚪</div>
        <div class="nav-btn" onclick="alert('الملف الشخصي للكابتن')">👤</div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <h2 id="statusTitle" style="font-size: 18px; font-weight: 800; margin-bottom: 5px;">أنت غير متصل</h2>
        <p id="statusSubtitle" style="font-size: 13px; color: var(--text-sub); margin-bottom: 15px;">اضغط على الزر لبدء استقبال الطلبات</p>
        
        <button id="toggleBtn" class="status-btn offline" onclick="toggleOnline()">
            <span id="btnIcon">💤</span> <span id="btnText">اتصال للعمل</span>
        </button>
    </div>

    <script>
        // 1. إعدادات Supabase
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- بيانات الكابتن (مؤقتة لحد ما نعمل شاشة تسجيل الدخول) ---
        // لازم الـ ID ده يكون موجود فعلاً في جدول users في Supabase عشان يتحدث
        const driverId = 1; // غير الرقم ده لـ ID كابتن حقيقي عندك في الداتابيز
        const driverName = "كابتن أحمد";
        // --------------------------------------------------------

        let isOnline = false;
        let map, driverMarker;
        let watchId = null;

        // 2. إعداد الخريطة
        map = L.map('map', { zoomControl: false }).setView([30.0444, 31.2357], 15); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        document.getElementById('map').classList.add('dark-tiles');

        // 3. تتبع موقع الكابتن
        function startTracking() {
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    
                    if (!driverMarker) {
                        const carIcon = L.divIcon({
                            html: `<div style="width: 40px; height: 40px; background: #00f2fe; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px #00f2fe; display: flex; justify-content: center; align-items: center; font-size: 20px;">🚗</div>`,
                            className: '', iconSize: [40, 40], iconAnchor: [20, 20]
                        });
                        driverMarker = L.marker([lat, lng], {icon: carIcon}).addTo(map);
                        map.setView([lat, lng], 16);
                    } else {
                        driverMarker.setLatLng([lat, lng]);
                    }

                    // لو الكابتن أونلاين، بنبعت الموقع للسيرفر (في جدول users)
                    if (isOnline) {
                        updateLocationInDB(lat, lng);
                    }
                }, null, { enableHighAccuracy: true });
            }
        }

        // 4. تحديث الموقع في الداتابيز
        async function updateLocationInDB(lat, lng) {
            const { error } = await supabaseClient
                .from('users')
                .update({ lat: lat, lng: lng, is_online: true })
                .eq('id', driverId);
            
            if (error) console.log("خطأ في تحديث الموقع:", error);
        }

        // 5. زرار الأونلاين والأوفلاين
        async function toggleOnline() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleBtn');
            const title = document.getElementById('statusTitle');
            const subtitle = document.getElementById('statusSubtitle');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            if (isOnline) {
                btn.className = 'status-btn online';
                btnText.innerText = 'أنت متصل الآن (أونلاين)';
                btnIcon.innerText = '📡';
                title.innerText = 'جاري البحث عن رحلات...';
                subtitle.innerText = 'موقعك يظهر الآن للركاب القريبين منك';
                if (driverMarker) {
                    const pos = driverMarker.getLatLng();
                    await updateLocationInDB(pos.lat, pos.lng);
                }
            } else {
                btn.className = 'status-btn offline';
                btnText.innerText = 'اتصال للعمل';
                btnIcon.innerText = '💤';
                title.innerText = 'أنت غير متصل';
                subtitle.innerText = 'اضغط على الزر لبدء استقبال الطلبات';
                
                await supabaseClient.from('users').update({ is_online: false }).eq('id', driverId);
            }
        }

        function logout() {
            if(confirm("خروج؟")) location.reload();
        }

        // تشغيل
        window.onload = startTracking;
    </script>
</body>
</html>
