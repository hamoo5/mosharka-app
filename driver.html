<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مشاركة - الكابتن</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; padding: 15px; margin: 0; text-align: center; }
        .header { background-color: #1A237E; color: white; padding: 15px; font-size: 22px; font-weight: bold; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .profile-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .profile-box input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo', sans-serif; }
        .ride-card { background-color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 15px; text-align: right; border-right: 6px solid #FFC107; transition: 0.3s; }
        .ride-card.accepted { border-right-color: #28a745; background-color: #f0fff4; }
        .ride-card h3 { margin: 0 0 10px 0; color: #1A237E; }
        .ride-card p { margin: 8px 0; color: #555; font-size: 16px; }
        .price { color: #28a745; font-weight: bold; font-size: 20px; }
        .btn-accept { background-color: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; font-family: 'Cairo', sans-serif; }
        .btn-accept:disabled { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">لوحة الكابتن</div>
    
    <div class="profile-box">
        <h3>بياناتك ككابتن</h3>
        <input type="text" id="driverName" placeholder="اكتب اسمك (مثال: أحمد محمد)">
        <input type="tel" id="driverPhone" placeholder="اكتب رقم تليفونك">
    </div>

    <div id="orders-container">
        <p>جاري تحميل الطلبات...</p>
    </div>

    <script>
        const supabaseUrl = 'https://xvnejwdobnzakpkamwdf.supabase.co'; 
        const supabaseKey = 'sb_publishable_onumEqReO_VO6tZPp4iNgg_iUsc6zTL';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchOrders() {
            const { data, error } = await supabaseClient
                .from('rides')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            const container = document.getElementById('orders-container');
            
            if (error) {
                container.innerHTML = '<p>حدث خطأ في جلب البيانات</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p style="color:#777;">لا توجد طلبات جديدة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(ride => {
                container.innerHTML += `
                    <div class="ride-card" id="card-${ride.id}">
                        <h3>طلب مشوار جديد</h3>
                        <p>المسافة: <b>${ride.distance} كم</b></p>
                        <p class="price">السعر: ${ride.price} جنيه</p>
                        <p><a href="https://www.google.com/maps?q=${ride.dest_lat},${ride.dest_lng}" target="_blank">📍 عرض موقع الوجهة</a></p>
                        <button class="btn-accept" id="btn-${ride.id}" onclick="acceptRide(${ride.id})">قبول المشوار</button>
                    </div>
                `;
            });
        }

        async function acceptRide(rideId) {
            const dName = document.getElementById('driverName').value;
            const dPhone = document.getElementById('driverPhone').value;

            if(!dName || !dPhone) {
                alert('برجاء كتابة اسمك ورقم تليفونك أولاً في الأعلى.');
                return;
            }

            const btn = document.getElementById(`btn-${rideId}`);
            btn.innerText = 'جاري القبول...';
            btn.disabled = true;

            const { data, error } = await supabaseClient
                .from('rides')
                .update({ 
                    status: 'accepted',
                    driver_name: dName,
                    driver_phone: dPhone
                })
                .eq('id', rideId);

            if (error) {
                alert('حدث خطأ، حاول مرة أخرى.');
                btn.innerText = 'قبول المشوار';
                btn.disabled = false;
            } else {
                const card = document.getElementById(`card-${rideId}`);
                card.classList.add('accepted');
                btn.innerText = 'تم قبول المشوار بنجاح ✓';
            }
        }

        fetchOrders();

        supabaseClient
            .channel('driver-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'rides' }, (payload) => {
                fetchOrders(); 
            })
            .subscribe();
    </script>
</body>
</html>
